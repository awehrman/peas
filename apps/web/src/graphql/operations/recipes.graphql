query RecipesPage(
  $query: String
  $category: String
  $categoryProvenance: CategoryProvenance
  $tag: String
  $conceptId: ID
  $page: Int
) {
  recipes(
    query: $query
    category: $category
    categoryProvenance: $categoryProvenance
    tag: $tag
    conceptId: $conceptId
    page: $page
  ) {
    items {
      id
      title
      imageUrl
      categories
      tags
      ingredientLineCount
      createdAt
    }
    total
    page
    pageSize
    concept {
      id
      canonicalName
      status
    }
  }
  recipeTaxonomy {
    categories
    tags
  }
}

query RecipeDetail($id: ID!) {
  recipe(id: $id) {
    id
    title
    noteId
    imageUrl
    categories {
      ...CategoryMembershipFields
    }
    tags {
      id
      name
    }
    sources {
      ...NoteSourceFields
    }
    ingredientBlocks {
      ...IngredientBlockFields
    }
    instructions {
      ...InstructionFields
    }
    createdAt
  }
  recipeTaxonomy {
    categories
    tags
  }
}

mutation UpdateRecipe($input: RecipeUpdateInput!) {
  updateRecipe(input: $input) {
    ...PayloadFields
  }
}

mutation PromoteCompletedNotes {
  promoteCompletedNotes {
    ...PayloadFields
    created
  }
}
