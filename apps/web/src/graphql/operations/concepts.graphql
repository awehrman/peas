query ConceptsPage($query: String, $page: Int) {
  concepts(query: $query, page: $page) {
    items {
      id
      slug
      canonicalName
      status
      entryCount
      mentionCount
    }
    total
    page
    pageSize
  }
}

query ConceptDetail($id: ID!) {
  concept(id: $id) {
    id
    slug
    canonicalName
    status
    description
    isComposed
    mergedInto {
      ...ConceptRefFields
    }
    entries {
      id
      text
      kind
      status
    }
    parents {
      id
      type
      status
      concept {
        ...ConceptRefFields
      }
    }
    children {
      id
      type
      status
      concept {
        ...ConceptRefFields
      }
    }
    attributes {
      attributeValueId
      definitionKey
      valueKey
      label
    }
    classifications {
      key
      kind
      value
      source
      inheritedFrom {
        ...ConceptRefFields
      }
      isExplicit
    }
    tags
    substitutions {
      concept {
        ...ConceptRefFields
      }
      ratio
      note
    }
    mentions {
      mentionId
      rawText
      lineText
      noteId
      noteTitle
      verified
    }
    decisions {
      id
      type
      revision
      createdAt
      username
      reverted
      canRevert
    }
  }
}

mutation SetConceptClassification($input: ConceptClassificationInput!) {
  setConceptClassification(input: $input) {
    ...PayloadFields
  }
}

mutation RemoveConceptClassification($conceptId: ID!, $key: String!) {
  removeConceptClassification(conceptId: $conceptId, key: $key) {
    ...PayloadFields
  }
}

mutation SetConceptTags($conceptId: ID!, $tags: [String!]!) {
  setConceptTags(conceptId: $conceptId, tags: $tags) {
    ...PayloadFields
  }
}

mutation SetConceptSubstitution($input: ConceptSubstitutionInput!) {
  setConceptSubstitution(input: $input) {
    ...PayloadFields
  }
}

mutation RemoveConceptSubstitution($conceptId: ID!, $substituteId: ID!) {
  removeConceptSubstitution(
    conceptId: $conceptId
    substituteId: $substituteId
  ) {
    ...PayloadFields
  }
}

query LexiconPage(
  $query: String
  $role: String
  $page: Int
  $includeRetired: Boolean
) {
  lexicon(
    query: $query
    role: $role
    page: $page
    includeRetired: $includeRetired
  ) {
    items {
      id
      text
      role
      kind
      status
      targetLabel
      conceptId
      attributeValueId
      preparationId
      valueKey
    }
    total
    page
    pageSize
  }
  vocabulary {
    definitions {
      id
      key
      name
    }
    attributeValues {
      id
      key
      label
      definitionId
      definitionKey
      definitionName
    }
    preparations {
      id
      key
      label
    }
    degreeKeys
    measurementModifierKeys
    instructionKeys
  }
}
