query ConceptsPage($query: String, $page: Int) {
  concepts(query: $query, page: $page) {
    items {
      id
      slug
      canonicalName
      status
      entryCount
      mentionCount
    }
    total
    page
    pageSize
  }
}

query ConceptDetail($id: ID!) {
  concept(id: $id) {
    id
    slug
    canonicalName
    status
    description
    isComposed
    mergedInto {
      ...ConceptRefFields
    }
    entries {
      id
      text
      kind
      status
    }
    parents {
      id
      type
      status
      concept {
        ...ConceptRefFields
      }
    }
    children {
      id
      type
      status
      concept {
        ...ConceptRefFields
      }
    }
    attributes {
      attributeValueId
      definitionKey
      valueKey
      label
    }
    classifications {
      key
      kind
      value
      source
      inheritedFrom {
        ...ConceptRefFields
      }
      isExplicit
    }
    tags
    substitutions {
      concept {
        ...ConceptRefFields
      }
      ratio
      note
    }
    mentions {
      mentionId
      rawText
      lineText
      noteId
      noteTitle
      verified
    }
    decisions {
      id
      type
      revision
      createdAt
      username
      reverted
      canRevert
    }
  }
}

fragment ConceptDistributionFields on ConceptDistributions {
  preparations {
    preparationKey
    label
    degreeKey
    direct
    expanded
  }
  attributes {
    definitionKey
    definitionName
    valueKey
    label
    direct
    expanded
    asserted
  }
  modifiers {
    role
    valueKey
    direct
    expanded
  }
}

query ConceptExplorer(
  $id: ID!
  $expand: [FoodRelationshipType!]
  $includeNeedsReview: Boolean
) {
  concept(id: $id) {
    id
    usage(expand: $expand, includeNeedsReview: $includeNeedsReview) {
      expand
      includeNeedsReview
      direct {
        mentions
        lines
        notes
        recipes
      }
      expanded {
        mentions
        lines
        notes
        recipes
      }
      byStatus {
        autoResolved
        verified
        needsReview
      }
      contributors {
        concept {
          ...ConceptRefFields
        }
        path
        depth
        counts {
          mentions
          lines
          notes
          recipes
        }
      }
    }
    observedForms(includeNeedsReview: $includeNeedsReview) {
      forms {
        entryId
        text
        kind
        status
        mentions
        notes
        example
      }
      otherMentions
    }
    distributions(expand: $expand, includeNeedsReview: $includeNeedsReview) {
      ...ConceptDistributionFields
    }
  }
}

query ConceptOccurrences(
  $conceptId: ID!
  $filter: ConceptOccurrenceFilter
  $after: String
  $expand: [FoodRelationshipType!]
  $includeNeedsReview: Boolean
) {
  concept(id: $conceptId) {
    id
    canonicalName
    distributions(expand: $expand, includeNeedsReview: $includeNeedsReview) {
      ...ConceptDistributionFields
    }
  }
  conceptOccurrences(conceptId: $conceptId, filter: $filter, after: $after) {
    total
    nextCursor
    items {
      mentionId
      lineId
      lineText
      span {
        start
        end
        text
      }
      noteId
      noteTitle
      recipeId
      recipeTitle
      concept {
        ...ConceptRefFields
      }
      path
      status
      preparations
      attributes
    }
  }
  conceptOccurrenceFacets(
    conceptId: $conceptId
    expand: $expand
    includeNeedsReview: $includeNeedsReview
  ) {
    sources {
      id
      label
      notes
    }
    categories {
      id
      name
      notes
    }
  }
}

mutation SetConceptClassification($input: ConceptClassificationInput!) {
  setConceptClassification(input: $input) {
    ...PayloadFields
  }
}

mutation RemoveConceptClassification($conceptId: ID!, $key: String!) {
  removeConceptClassification(conceptId: $conceptId, key: $key) {
    ...PayloadFields
  }
}

mutation SetConceptTags($conceptId: ID!, $tags: [String!]!) {
  setConceptTags(conceptId: $conceptId, tags: $tags) {
    ...PayloadFields
  }
}

mutation SetConceptSubstitution($input: ConceptSubstitutionInput!) {
  setConceptSubstitution(input: $input) {
    ...PayloadFields
  }
}

mutation RemoveConceptSubstitution($conceptId: ID!, $substituteId: ID!) {
  removeConceptSubstitution(
    conceptId: $conceptId
    substituteId: $substituteId
  ) {
    ...PayloadFields
  }
}

query LexiconPage(
  $query: String
  $role: String
  $page: Int
  $includeRetired: Boolean
  $newestFirst: Boolean
) {
  lexicon(
    query: $query
    role: $role
    page: $page
    includeRetired: $includeRetired
    newestFirst: $newestFirst
  ) {
    items {
      id
      text
      role
      kind
      status
      targetLabel
      conceptId
      attributeValueId
      preparationId
      valueKey
    }
    total
    page
    pageSize
  }
  vocabulary {
    definitions {
      id
      key
      name
    }
    attributeValues {
      id
      key
      label
      definitionId
      definitionKey
      definitionName
    }
    preparations {
      id
      key
      label
    }
    degreeKeys
    measurementModifierKeys
    instructionKeys
  }
}

query LexiconEntryPage($id: ID!, $after: String) {
  lexiconEntry(id: $id) {
    id
    text
    role
    kind
    status
    targetLabel
    conceptId
    revisionAdded
    revisionRetired
    createdAt
    occurrences(after: $after) {
      total
      nextCursor
      items {
        mentionId
        lineText
        span {
          start
          end
          text
        }
        noteId
        noteTitle
        recipeId
        recipeTitle
        conceptName
        status
      }
    }
  }
}

query UnknownExpressionsPage(
  $type: UnknownExpressionType
  $sourceId: ID
  $page: Int
) {
  unknownExpressions(type: $type, sourceId: $sourceId, page: $page) {
    items {
      discoveryId
      type
      phrase
      mentions
      notes
    }
    total
    page
    pageSize
  }
  unknownExpressionSources {
    id
    label
    notes
  }
}

query ConceptGraphPage(
  $conceptId: ID!
  $depth: Int
  $types: [FoodRelationshipType!]
  $direction: GraphDirection
) {
  concept(id: $conceptId) {
    id
    canonicalName
  }
  conceptGraph(
    conceptId: $conceptId
    depth: $depth
    types: $types
    direction: $direction
  ) {
    centerId
    truncated
    nodes {
      id
      canonicalName
      status
      level
      directMentions
    }
    edges {
      id
      sourceId
      targetId
      type
      status
      decision {
        revision
        username
      }
    }
  }
}
